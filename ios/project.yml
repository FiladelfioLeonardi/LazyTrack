name: LazyTrack
options:
  bundleIdPrefix: com.REPLACE_ME
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""
targets:
  LazyTrack:
    type: application
    platform: iOS
    sources:
      - path: LazyTrack
        excludes: ["Info.plist", "LazyTrack.entitlements"]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.REPLACE_ME.lazytrack
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: LazyTrack/Info.plist
      properties:
        CFBundleDisplayName: LazyTrack
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleURLTypes:
          - CFBundleURLName: lazytrack.setup
            CFBundleURLSchemes: [lazytrack]
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: LazyTrack sends your logs to the LazyTrack app on your Mac.
        NSCameraUsageDescription: Take a photo of your food to check whether it's junk food. The photo is never saved.
        NSPhotoLibraryUsageDescription: Pick a food photo to check whether it's junk food.
        NSLocationWhenInUseUsageDescription: Save where your gym is.
        NSLocationAlwaysAndWhenInUseUsageDescription: Log gym visits automatically when you stay at your gym for 30+ minutes, even when the app is closed.
        NSHealthShareUsageDescription: Read your sleep and step count for your weekly stats.
        NSBluetoothAlwaysUsageDescription: Keeps your LazyTrack Egg online through your phone when it has no WiFi.
        UIBackgroundModes: [bluetooth-central]
    entitlements:
      path: LazyTrack/LazyTrack.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
