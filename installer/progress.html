<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Installing LazyTrack</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=Rubik:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg: #efeaff; --card: #ffffff; --line: #1d1b20; --ink: #1d1b20; --ink-3: #6a6475; --yellow: #ffe45e; --green: #9be8a9; --red: #ff9d94; --lilac: #c9b8ff;
    --pixel: "Silkscreen", ui-monospace, monospace; --body: "Rubik", system-ui, sans-serif; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #17141f; --card: #221e2c; --line: #000; --ink: #f2eefb; --ink-3: #b3abc4; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body); display: grid; place-items: center; padding: 24px 16px; }
  .card { width: min(560px, 100%); background: var(--card); border: 3px solid var(--line); border-radius: 22px; box-shadow: 6px 6px 0 var(--line); padding: 26px 24px 22px; }
  .top { display: flex; align-items: center; gap: 16px; margin-bottom: 14px; }
  .pet { display: grid; grid-template-columns: repeat(16, 5px); grid-auto-rows: 5px; flex: none; animation: breathe 1.7s steps(1) infinite; }
  .pet i { display: block; } @keyframes breathe { 50% { transform: translateY(2px); } }
  h1 { font: 800 26px/1.15 var(--body); margin: 0; } .sub { margin: 4px 0 0; color: var(--ink-3); }
  .steps { list-style: none; padding: 0; margin: 18px 0 0; display: grid; gap: 10px; }
  .step { display: grid; grid-template-columns: 28px 1fr; gap: 2px 10px; align-items: start; }
  .dot { width: 24px; height: 24px; border: 3px solid var(--line); border-radius: 8px; display: grid; place-items: center; font: 700 13px var(--pixel); background: var(--card); }
  .step.run .dot { background: var(--yellow); animation: pulse 1s infinite; } .step.done .dot { background: var(--green); } .step.fail .dot { background: var(--red); }
  @keyframes pulse { 50% { transform: scale(.85); } }
  .step .n { font-weight: 600; } .step.wait .n { color: var(--ink-3); }
  .step .d { grid-column: 2; font: 400 12px var(--pixel); color: var(--ink-3); overflow-wrap: anywhere; }
  .bar { grid-column: 2; height: 12px; border: 3px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); margin-top: 4px; }
  .bar i { display: block; height: 100%; background: var(--lilac); transition: width .4s; }
  .bar.indet i { width: 30% !important; animation: slide 1.2s ease-in-out infinite; } @keyframes slide { from { margin-left: -30%; } to { margin-left: 100%; } }
  .msg { margin: 18px 0 0; padding: 12px 14px; border: 3px solid var(--line); border-radius: 14px; font-weight: 600; }
  .msg.err { background: #ffd0cc; color: #1d1b20; } .msg.ok { background: #c9f2d4; color: #1d1b20; }
  .btns { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
  .btn { border: 3px solid var(--line); border-radius: 14px; background: var(--card); color: var(--ink); box-shadow: 3px 3px 0 var(--line); font: 800 16px var(--body); padding: 10px 16px; cursor: pointer; text-decoration: none; }
  .btn.primary { background: var(--yellow); color: #1d1b20; } .btn:hover { transform: translate(-1px, -2px); box-shadow: 4px 5px 0 var(--line); }
  details { margin-top: 16px; } summary { cursor: pointer; font: 700 12px var(--pixel); color: var(--ink-3); }
  pre { max-height: 220px; overflow: auto; background: #1d1b20; color: #e8e3f5; border-radius: 12px; padding: 10px 12px; font: 12px/1.45 ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .note { color: var(--ink-3); font-size: 14px; margin: 14px 0 0; }
</style></head><body>
<div class="card">
  <div class="top"><div class="pet" id="pet" aria-hidden="true"></div>
    <div><h1 id="title">Installing LazyTrack</h1><p class="sub" id="sub">Hang tight, Mochi is moving in. This takes a few minutes.</p></div></div>
  <ol class="steps" id="steps"></ol>
  <div id="end"></div>
  <p class="note" id="note">You can leave this page open in the background. Closing it doesn't stop the install.</p>
  <details><summary>DETAILS</summary><pre id="log"></pre></details>
</div>
<script>
const $ = id => document.getElementById(id);
const PET = ["....oooooooo....", "...obbbbbbbbo...", "..obbbbbbbbbbo..", "..obbkbbbbkbbo..", "..obbkbbbbkbbo..", "..occbbbbbbcco..", "..obbbkbbkbbbo..",
  "..obbbbkkbbbbo..", "..oBbbbbbbbbBo..", "...oBbbbbbbBo...", "....obo..obo....", "....ooo..ooo...."];
const COL = {o: "#1d1b20", k: "#1d1b20", b: "#b9a7ff", B: "#9686d6", c: "#ff8fb1"};
$("pet").innerHTML = PET.join("").split("").map(c => `<i${COL[c] ? ` style="background:${COL[c]}"` : ""}></i>`).join("");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
let moved = false, logLen = 0;
async function tick() {
  let s;
  try { s = await (await fetch("/state", {cache: "no-store"})).json(); }
  catch (_) { if (!moved) $("note").textContent = "The installer has closed."; return; }
  $("steps").innerHTML = s.steps.map((st, i) => `<li class="step ${st.state || "wait"}"><span class="dot">${st.state === "done" ? "✓" : st.state === "fail" ? "!" : i + 1}</span>
    <span class="n">${esc(st.name)}</span>${st.detail ? `<span class="d">${esc(st.detail)}</span>` : ""}
    ${st.state === "run" ? `<div class="bar ${st.pct >= 0 ? "" : "indet"}"><i style="width:${Math.max(3, st.pct)}%"></i></div>` : ""}</li>`).join("");
  if (s.log.length !== logLen) { logLen = s.log.length; const pre = $("log"); pre.textContent = s.log.join("\n"); pre.scrollTop = pre.scrollHeight; }
  if (s.error) {
    $("title").textContent = "Something went wrong";
    $("sub").textContent = "Nothing is broken: you can try again. If it keeps happening, send a screenshot of this page.";
    $("end").innerHTML = `<div class="msg err">${esc(s.error)}</div><div class="btns"><button class="btn primary" id="again">Try again</button></div>`;
    $("again").onclick = async () => { $("end").innerHTML = ""; await fetch("/retry"); };
  } else if (s.done) {
    $("title").textContent = "LazyTrack is installed 🎉";
    $("sub").textContent = "Mochi is ready. Opening LazyTrack…";
    $("end").innerHTML = `<div class="msg ok">Find it any time in the Start menu or on your desktop (Mac: in Applications). It also starts by itself with your computer.</div>
      <div class="btns"><a class="btn primary" href="${esc(s.url)}">Open LazyTrack →</a></div>`;
    $("note").textContent = "";
    if (!moved) { moved = true; setTimeout(() => { location.href = s.url; }, 3500); }
    return;
  } else $("end").innerHTML = "";
  setTimeout(tick, 700);
}
tick();
</script>
</body></html>
